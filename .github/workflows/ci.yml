# Herdr Dots CI: the same checks on macOS, Linux and Windows, plus fuzzing,
# govulncheck and a short soak. Written in Phases 6 and 10; it runs once the
# developer pushes the repository (nothing is pushed automatically).
name: ci

on:
  push:
    branches: ["**"] # not tags: a release tag points at a commit main's CI already tested
  pull_request:
  # By hand on the release checksum pull request's branch: a pull request
  # opened by the workflow token doesn't trigger CI.
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly: the long soak

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1" # -race needs cgo; windows-latest ships gcc (MinGW)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9" # patched Go: govulncheck clean (go.mod stays at 1.25.0)
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: cross-compile
        if: runner.os == 'Linux'
        run: |
          for t in darwin/amd64 darwin/arm64 linux/arm64 windows/amd64 windows/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build ./... # no cgo, as the release build
          done
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: build the plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1
          if (-not (Test-Path bin/herdr-dots.exe)) { throw "bin/herdr-dots.exe missing" }
          ./bin/herdr-dots.exe --version
      - name: build the plugin (Unix)
        if: runner.os != 'Windows'
        run: |
          sh scripts/build.sh
          ./bin/herdr-dots --version

  vulncheck:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9" # patched Go: govulncheck clean (go.mod stays at 1.25.0)
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  fuzz:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' # long: nightly or by hand, not on every push
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9" # patched Go: govulncheck clean (go.mod stays at 1.25.0)
      - name: fuzz every target for 30s
        run: sh scripts/fuzz.sh 30s
      - name: keep crashers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"

  soak:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' # long: nightly or by hand, not on every push
    timeout-minutes: 350 # GitHub-hosted jobs stop at 6h; the 8h soak runs locally
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9" # patched Go: govulncheck clean (go.mod stays at 1.25.0)
      - name: soak (15m on pushes, 5h nightly)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            export SOAK_DURATION=5h SOAK_IDLE=10m
          else
            export SOAK_DURATION=15m SOAK_IDLE=5m
          fi
          go test -tags soak -run TestSoak -timeout 340m -v ./internal/engine/
