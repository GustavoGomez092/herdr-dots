# Windows acceptance: the Linux acceptance method
# (docs/superpowers/notes/2026-10-11-linux-acceptance.md) on a GitHub
# windows-latest runner, against the published release. Herdr runs headless;
# a stand-in claude (scripts/acceptance/windows) plays the agent and the dot's
# CLI. By hand only.
name: windows-acceptance

on:
  workflow_dispatch:
    inputs:
      herdr_version:
        description: "Herdr release to run"
        default: "v0.9.3"
        required: true
  # TEMPORARY while iterating: GitHub can't dispatch a workflow that isn't on
  # the default branch. Removed before the branch is handed over.
  push:
    branches: [win-acceptance]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9"
          cache: false
      - name: build the acceptance tools
        shell: pwsh
        run: |
          go build -tags acceptance -o C:\acc\tools\ ./scripts/acceptance/windows/acctool ./scripts/acceptance/windows/fakeclaude
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          Get-ChildItem C:\acc\tools
      - name: download Herdr
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ github.event.inputs.herdr_version || 'v0.9.3' }}'
          Invoke-WebRequest "https://github.com/herdrdev/herdr/releases/download/$v/herdr-windows-x86_64.zip" -OutFile C:\acc\herdr.zip
          Expand-Archive C:\acc\herdr.zip -DestinationPath C:\acc\herdr
          $herdr = (Get-ChildItem C:\acc\herdr -Recurse -Filter herdr.exe | Select-Object -First 1).FullName
          "HERDR_EXE=$herdr" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: acceptance run (steps 1-7)
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/acceptance/windows/run.ps1 -Herdr $env:HERDR_EXE -Tools C:\acc\tools -Repo $env:GITHUB_WORKSPACE
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-acceptance-evidence
          path: C:\acc\evidence
          if-no-files-found: warn
