# Herdr Dots release workflow. Written in Phase 10 and never run by it: the
# developer starts each step by hand (a user gate). Controller ruling P10-R12:
# internal/version/VERSION holds the exact version the binaries report
# (1.0.0-rc.1 now; the developer sets 1.0.0 for the final release).
#
#   (a) Candidate: a manual run of this workflow on main (Actions → release →
#       Run workflow; workflow_dispatch, no tag). scripts/release-kind.sh
#       checks VERSION is X.Y.Z or X.Y.Z-rc.<digits>. Then: tests on three
#       OSes, a 10-minute fuzz pass per target (a matrix of package groups),
#       govulncheck, the end-to-end install test, the six archives built
#       with GoReleaser (nothing published) from HERDR_DOTS_VERSION=$VERSION,
#       and a pull request that commits release/SHA256SUMS and
#       release/ASSET_ENV for exactly those archives. Its body says: "Merge
#       this, then tag v<VERSION> on the merge commit".
#   (b) Publish: push the tag v<VERSION> on that merge commit.
#       scripts/release-kind.sh checks the tag is v$VERSION and that the
#       committed ASSET_ENV and SHA256SUMS are for exactly that VERSION. The
#       job rebuilds the archives from the same source and settings, refuses
#       to go on unless they match the committed checksums byte for byte,
#       signs them with cosign (keyless, GitHub OIDC) and creates a draft
#       GitHub release for the developer to publish: a prerelease for an
#       -rc.<digits> VERSION, the final release for X.Y.Z. Any other VERSION
#       suffix, or a tag that is not v$VERSION, is refused.
#
# Herdr installs the default branch (or --ref), and scripts/build.sh only
# trusts release/SHA256SUMS from that tree, so the checksums a user installs
# always come from the repository they chose.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      mode: ${{ steps.v.outputs.mode }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        shell: bash
        run: |
          version=$(tr -d ' \r\n' < internal/version/VERSION)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "run the release candidate on main, not $GITHUB_REF" >&2
              exit 1
            fi
            kind=$(sh scripts/release-kind.sh candidate "$version")
            mode=candidate
          else
            kind=$(sh scripts/release-kind.sh publish "$version" "$GITHUB_REF_NAME" release)
            mode=publish
          fi
          prerelease=false
          if [ "$kind" = prerelease ]; then
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "mode=$mode"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: meta
    if: needs.meta.outputs.mode == 'candidate'
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9" # patched Go: govulncheck clean (go.mod stays at 1.25.0)
      - run: go vet ./...
      - run: go test -race ./...

  # 26 targets x 10 minutes don't fit one job: each group fuzzes its
  # packages' targets for 10 minutes each. TestReleaseFuzzMatrixCoversEveryTarget
  # checks the groups together cover every fuzz target in the module and
  # that the timeout keeps at least 30% headroom for the biggest group.
  fuzz:
    needs: meta
    if: needs.meta.outputs.mode == 'candidate'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: backends
            packages: ./internal/backend/ ./internal/council/ ./internal/credentials/
          - group: memory-and-transcripts
            packages: ./internal/memory/ ./internal/transcript/ ./internal/textutil/
          - group: dots-and-worktrees
            packages: ./internal/dots/ ./internal/worktree/ ./internal/dotpack/ ./internal/secrets/
          - group: config-and-io
            packages: ./internal/config/ ./internal/ipc/ ./internal/keys/ ./internal/mcpinstall/ ./internal/schedule/ ./internal/ui/diff/
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9" # patched Go: govulncheck clean (go.mod stays at 1.25.0)
      - run: sh scripts/fuzz.sh 10m ${{ matrix.packages }}
      - name: keep crashers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashers-${{ matrix.group }}
          path: "**/testdata/fuzz/**"

  # The end-to-end install test: release-local.sh builds the six archives,
  # and build.sh installs this host's one from a local server.
  e2e:
    needs: meta
    if: needs.meta.outputs.mode == 'candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9" # patched Go: govulncheck clean (go.mod stays at 1.25.0)
      - run: go test -run TestLocalReleaseInstallsEndToEnd -v ./scripts/
        env:
          HERDR_DOTS_E2E_RELEASE: "1"

  candidate:
    needs: [meta, test, fuzz, e2e]
    if: needs.meta.outputs.mode == 'candidate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9" # patched Go: govulncheck clean (go.mod stays at 1.25.0)
      # Security review R2: no candidate's checksums are proposed while
      # govulncheck reports a reachable vulnerability (as ci.yml's vulncheck job).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: pin the build inputs
        shell: bash
        run: |
          {
            echo "HERDR_DOTS_VERSION=${{ needs.meta.outputs.version }}"
            echo "ASSET_COMMIT=$(git rev-parse --short=12 HEAD)"
            echo "ASSET_TIME=$(git log -1 --format=%ct HEAD)"
          } > release/ASSET_ENV
          cat release/ASSET_ENV >> "$GITHUB_ENV"
      # Snapshot mode: a candidate has no tag yet. Every archive name, flag
      # and timestamp comes from release/ASSET_ENV, so the archives don't
      # depend on it, and the publish job runs the same command.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "v2.18.3"
          args: release --snapshot --clean --skip=publish,sign
      - name: commit the checksums on a branch and open a pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: "Archives built on main by release run ${{ github.run_id }}. Merge this, then tag `v${{ needs.meta.outputs.version }}` on the merge commit. A pull request opened by the workflow token doesn't trigger CI: run the ci workflow on this branch by hand first."
        run: |
          cp dist/SHA256SUMS release/SHA256SUMS
          # The run id keeps a rerun from colliding with an already-pushed branch.
          branch="release/v${{ needs.meta.outputs.version }}-checksums-${{ github.run_id }}-${{ github.run_attempt }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add release/SHA256SUMS release/ASSET_ENV
          git commit -m "release: checksums for v${{ needs.meta.outputs.version }} (candidate run ${{ github.run_id }})"
          git push origin "$branch"
          gh pr create --title "Release checksums for v${{ needs.meta.outputs.version }}" --body "$PR_BODY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-dist
          path: dist/

  publish:
    needs: meta
    if: needs.meta.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9" # patched Go: govulncheck clean (go.mod stays at 1.25.0)
      # meta already checked (release-kind.sh publish) that ASSET_ENV and
      # SHA256SUMS are for exactly this VERSION.
      - name: load the pinned build inputs
        shell: bash
        run: cat release/ASSET_ENV >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "v2.18.3"
          args: release --snapshot --clean --skip=publish,sign
      - name: the rebuilt archives must match the committed checksums
        run: diff -u release/SHA256SUMS dist/SHA256SUMS
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: sign every archive
        shell: bash
        run: |
          for f in dist/*.tar.gz dist/*.zip; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: draft the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --title "$GITHUB_REF_NAME")
          # An -rc.<digits> VERSION is a prerelease; X.Y.Z is the final release.
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            --notes "See CHANGELOG.md. Verify with: herdr-dots verify-release" \
            dist/*.tar.gz dist/*.zip dist/*.sigstore.json dist/SHA256SUMS
