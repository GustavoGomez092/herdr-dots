# Herdr Dots — always-on specialist agents for Herdr. Still a scaffold (0.x), not done.
id = "herdr-dots"
name = "Herdr Dots"
version = "0.6.0"
min_herdr_version = "0.8.0"
description = "Specialist agents (dots) that join your Claude Code / Codex sessions and review each turn. Scaffold release."
platforms = ["macos", "linux", "windows"]

# One build step per OS (build steps have no id, so item-level platforms may
# split them). Actions and panes can't be split: Herdr rejects duplicate ids
# even across platforms, so they all run ./bin/herdr-dots, which Herdr
# resolves to bin\herdr-dots.exe on Windows.
[[build]]
platforms = ["macos", "linux"]
command = ["sh", "scripts/build.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/build.ps1"]

[[startup]]
command = ["./bin/herdr-dots", "engine", "--ensure"]

[[actions]]
id = "manage"
title = "Dots: manage"
command = ["./bin/herdr-dots", "action", "manage"]

[[actions]]
id = "toggle-pane"
title = "Dots: toggle pane"
command = ["./bin/herdr-dots", "action", "toggle-pane"]

[[actions]]
id = "summon"
title = "Dots: summon"
command = ["./bin/herdr-dots", "action", "summon"]

[[actions]]
id = "council"
title = "Dots: council (ask every dot)"
command = ["./bin/herdr-dots", "action", "council"]

[[actions]]
id = "pause-all"
title = "Dots: pause/resume all"
command = ["./bin/herdr-dots", "action", "pause-all"]

[[panes]]
id = "pane"
title = "Dots"
placement = "split"
command = ["./bin/herdr-dots", "pane"]

[[panes]]
id = "manage"
title = "Dots: manage"
placement = "popup"
width = "80%"
height = "80%"
command = ["./bin/herdr-dots", "manage"]

[[panes]]
id = "diff"
title = "Dots: patch"
placement = "zoomed"
command = ["./bin/herdr-dots", "diff-ui"]

[[panes]]
id = "summon"
title = "Dots: summon"
placement = "popup"
width = "60%"
height = 14
command = ["./bin/herdr-dots", "summon-ui"]

[[panes]]
id = "council"
title = "Dots: council"
placement = "popup"
width = "70%"
height = 16
command = ["./bin/herdr-dots", "summon-ui", "--council"]
